name: Release

# Merging the release-please PR bumps .github/release-please/manifest.json. That
# push creates the GitHub release and tag, then attaches a source archive and its
# sha256, which Agent of Empires can install the plugin from (or from source).

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/release-please/manifest.json

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          skip-github-pull-request: true
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  publish:
    runs-on: ubuntu-latest
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release_please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run -C magefiles mage.go -w .. check
      - name: Build source archive
        run: |
          NAME=aoe-plugin-session-cleanup-${TAG}
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=aoe-plugin-session-cleanup-${TAG}
          gh release upload "${TAG}" "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"
